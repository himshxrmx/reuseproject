# Render Blueprint for RE:USE
# Creates 3 things on Render in one click:
#   1. reuse-db  - managed PostgreSQL (listings, reviews, users)
#   2. reuse-api - FastAPI backend (backend/ folder)
#   3. reuse-web - Next.js frontend (repo root)
# How to use: Render Dashboard -> New -> Blueprint -> pick this repo.
# Keys marked "sync: false" are secrets: Render asks you for them, they are never stored in git.

databases:
  - name: reuse-db
    plan: free
    region: singapore
    databaseName: reuse_db
    user: reuse
    ipAllowList: [] # only Render services can connect

services:
  - type: web
    name: reuse-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: reuse-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: TIGER_DATABASE_URL
        sync: false

  - type: web
    name: reuse-web
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      # Public URL of reuse-api + /api/v1, e.g. https://reuse-api-xxxx.onrender.com/api/v1
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false
      - key: NEXT_PUBLIC_ELEVENLABS_AGENT_ID
        sync: false
      - key: GROQ_API_KEY
        sync: false
